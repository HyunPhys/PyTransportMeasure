[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytransportmeasure"
version = "0.1.0"
description = "Hardware-validated transport measurement tools for Keithley 2450 Drain I-V sweeps."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.6",
  "pyvisa>=1.14",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
gui = ["PySide6>=6.7"]

[project.scripts]
ptm = "pytransport.cli:main"
ptm-gui = "pytransport.gui_app:main"

[tool.setuptools.packages.find]
include = ["pytransport*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
