measurement_name: dual_gate_lockin_four_terminal_dry_run
safety_preset: nano_device_safe
experiment:
  sample_id: simulated_graphene
  device_id: hall_bar_dual_gate_lockin_4t
  cooldown_id: dry_run
  contact_geometry: Hall bar, dual-gate four-terminal AC voltage readout
  contact_notes: Dry-run only; verify S/D excitation and Vxx+/Vxx- voltage contacts before hardware use.
  lab_notebook_ref: ''
  operator: ''
  notes: Dual-gate lock-in dry-run with SR860 differential four-terminal voltage geometry.
  tags:
    - dry-run
    - dual-gate
    - lock-in
    - four-terminal
    - graphene
measurement_geometry:
  terminal_count: 4
  method: four_terminal
  notes: Gate Keithleys bias top/back gates while SR860 reads differential voltage contacts.
gate1_instrument:
  id: keithley_2450
  address: GPIB0::2::INSTR
  timeout_ms: 10000
  terminal: FRONT
  voltage_range_v: 0.2
  current_range_a: 1.0e-9
  nplc: 1.0
gate2_instrument:
  id: keithley_2450
  address: GPIB0::3::INSTR
  timeout_ms: 10000
  terminal: FRONT
  voltage_range_v: 0.2
  current_range_a: 1.0e-9
  nplc: 1.0
lockin:
  enabled: true
  id: srs_sr860
  address: GPIB0::4::INSTR
  timeout_ms: 10000
  channels:
    - x
    - y
    - r
    - theta
  read_timing: after_dc_settle
  reference_source: internal
  reference_frequency_hz: 17.777
  sine_output_amplitude_v: 0.01
  input_mode: voltage
  voltage_input: a-b
  input_coupling: ac
  input_grounding: float
  voltage_input_range_v: 0.01
  sensitivity_index: 18
  time_constant_index: 10
  settle_time_constants: 3.0
  filter_slope_db_per_oct: 24
  synchronous_filter: false
topology:
  device_layout: hall_bar
  gate1_role: top_gate
  gate2_role: back_gate
  source_contact: S
  drain_contact: D
  lockin_input_mode: voltage
  lockin_input_contacts:
    - Vxx+
    - Vxx-
  voltage_probe_role: longitudinal
  channel_length_m: 5.0e-6
  channel_width_m: 2.0e-6
  excitation_source: sr860_sine_out
  excitation_contacts:
    - S
    - D
  excitation_amplitude_v: 0.01
  current_bias_resistor_ohm: 1000000
  notes: Four-terminal Hall-bar topology; voltage contacts must stay separate from source/drain excitation contacts.
gate1_sweep:
  start_v: -0.1
  stop_v: 0.1
  points: 5
  settle_s: 0.0
  current_compliance_a: 1.0e-8
gate2_sweep:
  start_v: -0.1
  stop_v: 0.1
  points: 5
  settle_s: 0.0
  current_compliance_a: 1.0e-8
output:
  directory: data/raw
checks:
  require_completed: true
  min_points: 25
