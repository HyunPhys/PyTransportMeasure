measurement_name: dual_gate_lockin_limited_active
safety_preset: nano_device_safe
experiment:
  sample_id: safe_test_device
  device_id: hall_bar_dual_gate_lockin
  cooldown_id: ''
  contact_geometry: Hall bar dual-gate AC lock-in
  contact_notes: Edit contact labels and wiring before hardware use.
  lab_notebook_ref: ''
  operator: ''
  notes: Tiny guarded active dual-gate lock-in sweep. Use only after preflight, readout smoke, and active-gate smoke pass.
  tags:
    - hardware-smoke
    - dual-gate
    - lock-in
    - guarded-active-sweep
measurement_geometry:
  terminal_count: 2
  method: two_terminal
  notes: Source-drain lock-in readout while two Keithleys sweep a tiny gate-bias grid.
gate1_instrument:
  id: keithley_2450
  address: GPIB0::2::INSTR
  timeout_ms: 10000
  terminal: FRONT
  voltage_range_v: 0.05
  current_range_a: 1.0e-9
  nplc: 1.0
gate2_instrument:
  id: keithley_2450
  address: GPIB0::3::INSTR
  timeout_ms: 10000
  terminal: FRONT
  voltage_range_v: 0.05
  current_range_a: 1.0e-9
  nplc: 1.0
lockin:
  enabled: true
  id: srs_sr860
  address: GPIB0::4::INSTR
  timeout_ms: 10000
  channels:
    - x
    - y
    - r
    - theta
  read_timing: after_dc_settle
  reference_source: internal
  reference_frequency_hz: 17.777
  sine_output_amplitude_v: 0.01
  input_mode: voltage
  voltage_input: a
  input_coupling: ac
  input_grounding: float
  voltage_input_range_v: 0.01
  sensitivity_index: 18
  time_constant_index: 10
  filter_slope_db_per_oct: 24
  synchronous_filter: false
topology:
  device_layout: hall_bar
  gate1_role: top_gate
  gate2_role: back_gate
  source_contact: S
  drain_contact: D
  lockin_input_mode: voltage
  lockin_input_contacts:
    - Vxx+
    - Vxx-
  excitation_source: sr860_sine_out
  excitation_contacts:
    - S
    - D
  excitation_amplitude_v: 0.01
  current_bias_resistor_ohm: 1000000
  notes: Edit labels and excitation path to match the real Hall bar wiring.
gate1_sweep:
  start_v: 0.0
  stop_v: 0.01
  points: 2
  settle_s: 0.2
  current_compliance_a: 1.0e-8
gate2_sweep:
  start_v: 0.0
  stop_v: 0.01
  points: 2
  settle_s: 0.2
  current_compliance_a: 1.0e-8
output:
  directory: data/raw
checks:
  require_completed: true
  min_points: 4
