measurement_name: ac_lockin_four_terminal_dry_run
safety_preset: nano_device_safe
experiment:
  sample_id: simulated_graphene
  device_id: hall_bar_ac_lockin
  cooldown_id: dry_run
  contact_geometry: Hall bar, four-terminal differential voltage readout
  contact_notes: Dry-run only; edit contact labels and wiring notes before hardware use.
  lab_notebook_ref: ''
  operator: ''
  notes: Four-terminal AC/lock-in dry-run for validating differential SR860 voltage geometry.
  tags:
    - dry-run
    - ac-lockin
    - four-terminal
    - graphene
measurement_geometry:
  terminal_count: 4
  method: four_terminal
  notes: Keithley biases source-drain while SR860 reads differential voltage input A-B.
source_instrument:
  id: keithley_2450
  address: GPIB0::2::INSTR
  timeout_ms: 10000
  terminal: FRONT
  voltage_range_v: 0.1
  current_range_a: 1.0e-6
  nplc: 1.0
lockin:
  enabled: true
  id: srs_sr860
  address: GPIB0::4::INSTR
  timeout_ms: 10000
  channels:
    - x
    - y
    - r
    - theta
  read_timing: after_dc_settle
  reference_source: internal
  reference_frequency_hz: 17.777
  sine_output_amplitude_v: 0.01
  input_mode: voltage
  voltage_input: a-b
  input_coupling: ac
  input_grounding: float
  voltage_input_range_v: 0.01
  sensitivity_index: 18
  time_constant_index: 10
  settle_time_constants: 3.0
  filter_slope_db_per_oct: 24
  synchronous_filter: false
topology:
  source_contact: S
  drain_contact: D
  lockin_input_mode: voltage
  lockin_input_contacts:
    - Vxx+
    - Vxx-
  excitation_contacts:
    - S
    - D
  voltage_probe_role: longitudinal
  notes: Four-terminal AC dry-run contact map; edit labels to match the Hall bar before hardware use.
bias_sweep:
  mode: linear_one_way
  start_v: -0.05
  stop_v: 0.05
  points: 11
  delay_s: 0.0
  current_compliance_a: 1.0e-6
output:
  directory: data/raw
checks:
  require_completed: true
  min_points: 11
