measurement_name: ac_lockin_dry_run
safety_preset: nano_device_safe
experiment:
  sample_id: simulated_sample
  device_id: simulated_lockin_device
  operator: ""
  notes: Dry-run AC/lock-in bias sweep skeleton for validating recipe, CSV, metadata, plot, and report flow.
  tags:
    - dry-run
    - ac-lockin
source_instrument:
  id: keithley_2450
  address: GPIB0::2::INSTR
  timeout_ms: 10000
  terminal: FRONT
  voltage_range_v: 0.1
  current_range_a: 1.0e-6
  nplc: 1.0
lockin:
  enabled: true
  id: srs_sr860
  address: GPIB0::4::INSTR
  timeout_ms: 10000
  channels:
    - x
    - y
    - r
    - theta
  read_timing: after_dc_settle
bias_sweep:
  mode: linear_one_way
  start_v: -0.05
  stop_v: 0.05
  points: 11
  delay_s: 0.0
  current_compliance_a: 1.0e-6
output:
  directory: data/raw
checks:
  require_completed: true
  min_points: 11
