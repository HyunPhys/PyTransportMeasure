measurement_name: drain_iv_1k_multisegment
safety_preset: resistor_1k_check
experiment:
  sample_id: resistor_box
  device_id: 1k_resistor
  operator: ""
  notes: Multi-segment Drain I-V smoke test with a 1 kOhm resistor.
  tags:
    - smoke-test
    - resistor
    - multi-segment
instrument:
  id: keithley_2450
  address: GPIB0::2::INSTR
  timeout_ms: 10000
  terminal: FRONT
  voltage_range_v: 0.2
  current_range_a: 2.0e-4
  nplc: 1.0
sweep:
  mode: multi_segment
  delay_s: 0.05
  current_compliance_a: 2.0e-4
  segments:
    - start_v: -0.1
      stop_v: 0.0
      points: 11
    - start_v: 0.0
      stop_v: 0.1
      points: 11
      delay_s: 0.02
output:
  directory: data/raw
checks:
  require_completed: true
  min_points: 21
  fitted_resistance_ohm:
    min_ohm: 900
    max_ohm: 1100
