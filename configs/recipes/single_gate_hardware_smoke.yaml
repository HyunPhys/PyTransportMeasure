measurement_name: single_gate_hardware_smoke
safety_preset: single_gate_first_contact
experiment:
  sample_id: hardware_smoke_sample
  device_id: single_gate_device
  operator: ""
  notes: Conservative two-Keithley single-gate hardware smoke test. Edit addresses before use.
  tags:
    - smoke-test
    - single-gate
    - hardware
drain_instrument:
  id: keithley_2450
  address: GPIB0::2::INSTR
  timeout_ms: 10000
  terminal: FRONT
  voltage_range_v: 0.1
  current_range_a: 1.0e-7
gate_instrument:
  id: keithley_2450
  address: GPIB0::3::INSTR
  timeout_ms: 10000
  terminal: FRONT
  voltage_range_v: 0.2
  current_range_a: 1.0e-9
gate_sweep:
  start_v: -0.1
  stop_v: 0.1
  points: 3
  settle_s: 0.2
  current_compliance_a: 1.0e-9
drain_sweep:
  mode: linear_one_way
  start_v: -0.05
  stop_v: 0.05
  points: 5
  delay_s: 0.05
  current_compliance_a: 1.0e-7
output:
  directory: data/raw
checks:
  require_completed: true
  min_points: 15
