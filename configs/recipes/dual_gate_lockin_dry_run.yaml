measurement_name: dual_gate_lockin_dry_run
safety_preset: nano_device_safe
experiment:
  sample_id: simulated_graphene
  device_id: hall_bar_dual_gate_lockin
  cooldown_id: dry_run
  contact_geometry: Hall bar, simulated dual-gate AC device
  contact_notes: Dry-run only; SR860 excitation/readout topology is not hardware-enabled yet.
  lab_notebook_ref: ''
  operator: ''
  notes: Dual-gate lock-in dry-run foundation for Hall bar graphene workflows.
  tags:
    - dry-run
    - dual-gate
    - lock-in
    - graphene
measurement_geometry:
  terminal_count: 2
  method: two_terminal
  notes: Simulated source-drain lock-in readout while two Keithleys sweep gate biases.
gate1_instrument:
  id: keithley_2450
  address: GPIB0::2::INSTR
  timeout_ms: 10000
  terminal: FRONT
  voltage_range_v: 0.2
  current_range_a: 1.0e-9
  nplc: 1.0
gate2_instrument:
  id: keithley_2450
  address: GPIB0::3::INSTR
  timeout_ms: 10000
  terminal: FRONT
  voltage_range_v: 0.2
  current_range_a: 1.0e-9
  nplc: 1.0
lockin:
  enabled: true
  id: srs_sr860
  address: GPIB0::4::INSTR
  timeout_ms: 10000
  channels:
    - x
    - y
    - r
    - theta
  read_timing: after_dc_settle
gate1_sweep:
  start_v: -0.1
  stop_v: 0.1
  points: 5
  settle_s: 0.0
  current_compliance_a: 1.0e-8
gate2_sweep:
  start_v: -0.1
  stop_v: 0.1
  points: 5
  settle_s: 0.0
  current_compliance_a: 1.0e-8
output:
  directory: data/raw
checks:
  require_completed: true
  min_points: 25
