measurement_name: pulse_dry_run
safety_preset: nano_device_safe
experiment:
  sample_id: simulated_sample
  device_id: simulated_pulse_device
  operator: ""
  notes: Dry-run pulse measurement skeleton for validating recipe, CSV, metadata, plot, and report flow.
  tags:
    - dry-run
    - pulse
measurement_geometry:
  terminal_count: 2
  method: two_terminal
  notes: Pulse source and current readback use the same Keithley force leads.
source_instrument:
  id: keithley_2450
  address: GPIB0::2::INSTR
  timeout_ms: 10000
  terminal: FRONT
  voltage_range_v: 0.2
  current_range_a: 1.0e-6
  nplc: 1.0
pulse:
  base_v: 0.0
  amplitude_v: 0.1
  width_s: 0.001
  period_s: 0.01
  count: 5
  current_compliance_a: 1.0e-6
  acquisition: pulse_end
pulse_limits:
  max_abs_pulse_v: 0.2
  max_pulse_width_s: 0.01
  max_duty_cycle: 0.2
  max_pulse_count: 100
  max_total_on_time_s: 0.1
output:
  directory: data/raw
checks:
  require_completed: true
  min_points: 5
