measurement_name: drain_iv_1k_forward_backward
safety_preset: resistor_1k_check
experiment:
  sample_id: resistor_box
  device_id: 1k_resistor
  operator: ""
  notes: Forward/backward Drain I-V smoke test with a 1 kOhm resistor.
  tags:
    - smoke-test
    - resistor
    - forward-backward
measurement_geometry:
  terminal_count: 2
  method: two_terminal
  notes: Source and measure current through the same Keithley force leads.
instrument:
  id: keithley_2450
  address: GPIB0::2::INSTR
  timeout_ms: 10000
  terminal: FRONT
  voltage_range_v: 0.2
  current_range_a: 2.0e-4
  nplc: 1.0
sweep:
  mode: forward_backward
  start_v: -0.1
  stop_v: 0.1
  points: 21
  delay_s: 0.05
  current_compliance_a: 2.0e-4
output:
  directory: data/raw
checks:
  require_completed: true
  min_points: 41
  fitted_resistance_ohm:
    min_ohm: 900
    max_ohm: 1100
