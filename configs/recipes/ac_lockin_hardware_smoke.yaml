measurement_name: ac_lockin_hardware_smoke
safety_preset: nano_device_safe
experiment:
  sample_id: hardware_smoke_sample
  device_id: ac_lockin_device
  operator: ""
  notes: Conservative Keithley + SR860 two-terminal AC/lock-in hardware smoke test. Edit addresses before use.
  tags:
    - smoke-test
    - ac-lockin
    - hardware
measurement_geometry:
  terminal_count: 2
  method: two_terminal
  notes: Keithley source path and SR860 lock-in readout treated as two-terminal AC smoke geometry.
source_instrument:
  id: keithley_2450
  address: GPIB0::2::INSTR
  timeout_ms: 10000
  terminal: FRONT
  voltage_range_v: 0.02
  current_range_a: 1.0e-7
  nplc: 1.0
lockin:
  enabled: true
  id: srs_sr860
  address: GPIB0::4::INSTR
  timeout_ms: 10000
  channels:
    - x
    - y
    - r
    - theta
  read_timing: after_dc_settle
  reference_source: internal
  reference_frequency_hz: 17.777
  sine_output_amplitude_v: 0.01
  input_mode: voltage
  voltage_input: a
  input_coupling: ac
  input_grounding: float
  voltage_input_range_v: 0.01
  sensitivity_index: 18
  time_constant_index: 10
  filter_slope_db_per_oct: 24
  synchronous_filter: false
bias_sweep:
  mode: linear_one_way
  start_v: -0.01
  stop_v: 0.01
  points: 5
  delay_s: 0.1
  current_compliance_a: 1.0e-7
output:
  directory: data/raw
checks:
  require_completed: true
  min_points: 5
