measurement_name: single_gate_dry_run
safety_preset: nano_device_safe
experiment:
  sample_id: simulated_sample
  device_id: simulated_fet
  operator: ""
  notes: Dry-run single-gate sweep for validating recipe, CSV, and metadata flow.
  tags:
    - dry-run
    - single-gate
drain_instrument:
  id: keithley_2450
  address: GPIB0::2::INSTR
  timeout_ms: 10000
  terminal: FRONT
  voltage_range_v: 0.2
  current_range_a: 1.0e-6
gate_instrument:
  id: keithley_2450
  address: GPIB0::3::INSTR
  timeout_ms: 10000
  terminal: FRONT
  voltage_range_v: 1.0
  current_range_a: 1.0e-9
gate_sweep:
  start_v: -0.5
  stop_v: 0.5
  points: 5
  settle_s: 0.0
  current_compliance_a: 1.0e-8
drain_sweep:
  mode: linear_one_way
  start_v: -0.1
  stop_v: 0.1
  points: 11
  delay_s: 0.0
  current_compliance_a: 1.0e-6
output:
  directory: data/raw
checks:
  require_completed: true
  min_points: 55
